<!DOCTYPE html>

<style>
*{box-sizing:border-box}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171212;--card:#221b1b;--tx:#f2eaea;--mu:#b3a5a5;--rd:#ff5a66;--rd-d:#d63c48;--bd:#3a2c2c;--ok:#5dd07f;--sh:0 1px 4px rgba(0,0,0,.4)}}

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}

#syncState{position:fixed;bottom:10px;left:10px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:.75rem;color:var(--mu);z-index:50;box-shadow:var(--sh)}
#syncState.on{color:var(--ok)}
</style></head><body>

<header>

<script type="module">
/* =========================================================
   FIREBASE — Configuration

  getFirestore, collection, doc, setDoc, updateDoc, onSnapshot,
  getDocs, deleteDoc, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3PJ5ev5CXI8liepndmXD5aJhwd6UMmeU",
  authDomain: "clinique-damour.firebaseapp.com",
  projectId: "clinique-damour",
  storageBucket: "clinique-damour.firebasestorage.app",
  messagingSenderId: "763303707249",
  appId: "1:763303707249:web:248871d5a54cc791a411d0"
};

const app = initializeApp(firebaseConfig);
const firestore = getFirestore(app);

/* =========================================================
   OUTILS
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CH = [
{n:"Article 1",t:"Objectif du groupe",b:[{p:"La Clinique d'Amour est une communauté solidaire qui vise à promouvoir la fraternité, l'entraide sociale, la convivialité et la création d'opportunités à travers des activités sociales et économiques communes."}]},
{n:"Article 2",t:"Respect mutuel et ambiance de groupe",b:[{ul:["La Clinique d'Amour est un espace de détente, d'humour et de taquinerie saine, propre à renforcer les liens fraternels entre membres.","Toutefois, aucune taquinerie ne doit heurter la dignité, la sensibilité ou les convictions d'un membre.","Toute personne s'estimant calomniée ou diabolisée en rapport avec son activité dans le groupe peut le dénoncer, à condition de citer nommément la ou les personnes concernées.","En cas de dénonciation sans preuve ni identification précise, l'auteur de la plainte pourra être suspendu provisoirement pour calomnie injustifiée ou tentative de discorde."]}]},
{n:"Article 3",t:"Adhésion",b:[{p:"L'adhésion à La Clinique d'Amour est ouverte à toute personne partageant les valeurs de la communauté, sans distinction d'origine, d'ethnie, de religion ou de nationalité."},{p:"Elle est conditionnée par les éléments suivants :"},{ul:["Validation de la candidature par au moins deux membres du bureau de coordination ;","Signature de la Charte d'engagement individuelle, marquant l'acceptation de la charte réglementaire ;","Paiement d'un droit d'entrée non remboursable de 5.000 FCFA."]},{note:"Tout membre adhérant s'engage, par cet acte, à respecter les dispositions de la présente charte ainsi que les valeurs fondamentales de la communauté."}]},
{n:"Article 4",t:"Qualité de membre",b:[{h:"a. Membre actif"},{ul:["Toute personne ayant signé la Charte d'engagement individuelle ;","Qui est à jour de ses cotisations ;","Qui participe activement à la vie de la communauté (activités, discussions, entraide, cotisations spéciales, etc.)."]},{p:"Les membres actifs bénéficient pleinement de tous les avantages, soutiens et droits prévus par la charte réglementaire."},{h:"b. Membre sympathisant"},{ul:["Toute personne présente sur les plateformes de la communauté ;","Qui respecte les règles de fonctionnement du groupe ;","Mais qui n'est pas tenue de participer aux cotisations ou aux activités sociales."]},{p:"Le membre sympathisant n'a pas droit aux soutiens financiers ou avantages réservés aux membres actifs."},{h:"c. Membre parrain"},{ul:["Toute personne, membre du groupe ou non ;","Qui apporte un soutien financier régulier ou ponctuel aux projets, activités ou cas sociaux de la communauté."]},{p:"Le membre parrain est libre de s'impliquer à la hauteur de sa volonté et peut être reconnu publiquement pour sa contribution, selon son souhait."},{note:"NB : Toute personne ne se reconnaissant dans aucune de ces trois catégories de membre et ne remplissant aucune des conditions ci-dessus pourra être retirée du groupe sur décision du bureau, après avertissement."}]},
{n:"Article 9",t:"Durée du mandat",b:[{p:"Le mandat du Bureau est fixé à douze (12) mois, renouvelable. Un vote de renouvellement ou de remplacement peut être convoqué en cas de :"},{ul:["Manquement grave aux responsabilités ;","Inactivité ou démission ;","Faute éthique ou financière."]},{p:"Le Bureau reste placé sous le regard du Comité de Contrôle et d'Éthique ainsi que de l'Autorité Morale, garant de la vision, des valeurs et de la cohésion de la communauté."}]},
{n:"Article 12",t:"Respect, diffamation et gestion des réclamations",b:[{ul:["La diffamation, la calomnie, les accusations publiques non fondées ou les propos visant à nuire à l'image d'un membre ou d'un responsable sont strictement interdits.","Tout membre ayant des reproches, des incompréhensions ou des inquiétudes concernant le fonctionnement du groupe ou les actions d'un membre du bureau est invité à adresser un message privé et respectueux au Coordinateur Général, puis à attendre un retour ou une médiation adéquate dans un délai raisonnable.","Si aucune suite satisfaisante n'est apportée à sa demande, le membre a le droit d'exprimer publiquement sa plainte dans le groupe, dans le respect de la charte et des personnes concernées."]},{p:"Tout comportement contraire à cette disposition pourra faire l'objet de sanctions disciplinaires (avertissement, suspension temporaire ou exclusion), selon la gravité des faits et après avis de la majorité des membres du Bureau."}]},
{n:"Article 13",t:"Activités de la Clinique",b:[{p:"La Clinique d'Amour organise ses activités autour de 5 commissions stratégiques, chacune pilotée par un responsable désigné par la communauté. Chaque membre est invité à s'y engager activement selon ses compétences, intérêts ou aspirations."},{h:"a. Commission Éducation, Réseautage et Carrière"},{ul:["Organisation d'ateliers, causeries, conférences, webinaires, groupes de mentorat.","Promotion du partage d'expériences et d'opportunités professionnelles ou entrepreneuriales.","Développement d'outils et contenus pédagogiques internes."]},{h:"b. Commission AGR et Ristournes Solidaires"},{ul:["Lancement des Activités Génératrices de Revenus (AGR) : projets communautaires permettant de diversifier les sources de revenus du groupe, de créer de l'emploi pour les membres et de générer des avantages collectifs.","Organisation de ristournes : au-delà des initiatives des membres, la Clinique initiera des ristournes par groupe grâce aux bénéfices issus des AGR, pour une distribution équitable de l'investissement via une application mobile sécurisée."]},{h:"c. Commission Vie communautaire et Bien-être"},{ul:["Excursions et sorties de détente : moments de loisir organisés régulièrement pour renforcer la convivialité, la fraternité et la solidarité au sein de la communauté.","Anniversaire des membres : prises d'initiatives pour les anniversaires des membres, moyennant 1.000 F CFA par participant.","Initiatives personnelles : participation coordonnée aux initiatives des membres."]},{h:"d. Commission Actions humanitaires et Engagement citoyen"},{ul:["Dons et visites : organisation de dons dans les orphelinats, prisons et autres lieux vulnérables.","Activités d'intérêt public : actions citoyennes au bénéfice de la collectivité (campagnes de sensibilisation, nettoyages communautaires, dons de sang, etc.)."]},{h:"e. Commission Assistance et Projets des membres"},{ul:["Soutien aux projets des membres : possibilité d'un accompagnement financier ou matériel, sous conditions strictes validées par le Comité de Contrôle et d'Éthique.","Assistances sociales : aides accordées lors d'événements heureux (naissances, mariages…) ou malheureux (maladie, deuil…) selon les modalités prévues par le règlement."]}]},
{n:"Article 14",t:"Assistance sociale",b:[{h:"Conditions générales"},{p:"L'assistance sociale est réservée aux membres actifs justifiant :"},{ul:["D'une ancienneté d'au moins 6 mois ;","D'être à jour de leurs cotisations mensuelles ;","Et d'une participation régulière à la vie de la communauté."]},{h:"a. Barème des assistances"},{table:[["Événement","Montant de l'assistance","Fonds de caisse"],["Décès du père ou de la mère biologique","5.000 FCFA","5%"],["Décès d'un frère ou d'une sœur biologique","2.500 FCFA","5%"],["Décès d'un enfant biologique","10.000 FCFA","5%"],["Décès du conjoint sous le même toit","10.000 FCFA","5%"],["Décès du membre","10.000 FCFA","0%"],["Dot traditionnelle","5.000 FCFA","5%"],["Dot + mariage civil/officiel (après 1 an)","10.000 FCFA","10%"],["Hospitalisation (séjour ≥ 3 nuits)","3.500 FCFA","0%"],["Soutenance pour un diplôme universitaire (membre)","5.000 FCFA","5%"],["Anniversaire de la Clinique","10.000 FCFA","0%"]]},{h:"b. Cas exceptionnels"},{p:"En cas de situation imprévue ou d'urgence sociale majeure, une levée de fonds spéciale pourra être autorisée par le bureau, avec la validation des 2/3 de la communauté."},{h:"c. Cadeau mariage"},{p:"Le cadeau de la Clinique d'Amour lors des mariages se fera sous forme de chèque précisant le montant, remis à l'intéressé. L'enveloppe est remise à l'intéressé à la veille de l'événement par le Bureau de coordination, sous l'œil du comité de contrôle."}]},
{n:"Article 15",t:"Célébration de l'anniversaire de la Clinique",b:[{p:"La célébration annuelle de l'anniversaire de La Clinique d'Amour constitue un moment fort de cohésion, de bilan et de dynamisme communautaire."},{h:"a. Cotisation obligatoire"},{p:"Tous les membres actifs sont tenus de participer financièrement à l'organisation de cet événement, qu'ils soient physiquement présents ou non. Cette cotisation est obligatoire, et son montant est fixé à 10.000 FCFA."},{h:"b. Organisation alternée"},{p:"L'événement est organisé de manière rotative entre Brazzaville et Pointe-Noire, afin de favoriser l'inclusion géographique des membres et le partage des responsabilités."},{h:"c. Appui du fonds de caisse"},{p:"Le fonds de caisse communautaire peut être mobilisé en appui logistique ou financier, selon les besoins réels liés à l'organisation. Toute dépense doit être validée au préalable par l'Assemblée Générale, dans un esprit de transparence et de bonne gouvernance."}]},
{n:"Article 16",t:"Sanctions disciplinaires",b:[{p:"Afin de préserver l'harmonie, le respect mutuel et l'engagement au sein de La Clinique d'Amour, des sanctions peuvent être appliquées en cas de manquement aux principes de la Charte. Les mesures suivantes peuvent être prises, selon la gravité des faits :"},{ul:["Avertissement","Blâme","Suspension temporaire (1 semaine à 1 mois)","Radiation définitive"]},{p:"Les membres du Bureau, en tant que figures de référence, se doivent d'être exemplaires dans leur conduite. Toute faute avérée de leur part entraînera une évaluation immédiate de leur maintien en fonction par le reste du Bureau, sous supervision de l'Autorité Morale."}]},
{n:"Article 17",t:"Assemblée Générale et réunions",b:[{p:"L'Assemblée Générale Ordinaire (AGO) est organisée en présentiel une fois par an. Elle permet de :"},{ul:["Statuer sur l'adoption du rapport d'activités annuel ;","Valider le bilan financier de l'année écoulée ;","Approuver le nouveau programme d'activités ;","Procéder au renouvellement du Bureau si nécessaire ;","Débattre et statuer sur toute question essentielle à la vie de la communauté."]},{p:"Des dispositions techniques et organisationnelles (retransmission en ligne, accès aux documents, prise de parole à distance…) doivent être prévues pour faciliter la participation des membres résidant hors du pays ou dans d'autres localités."},{p:"Une Assemblée Générale Extraordinaire (AGE) peut être convoquée en ligne à tout moment de l'année, en cas de besoin urgent ou de situation exceptionnelle."},{p:"Les réunions du Bureau sont organisées au moins une fois par trimestre, en présentiel ou en ligne, selon les disponibilités et la nature des points à traiter."}]},
{n:"Article 18",t:"Clause de confidentialité et de respect de la vie privée",b:[{p:"Les échanges, informations ou situations personnelles partagées au sein du groupe sont strictement confidentiels."},{p:"Toute capture d'écran, diffusion, reproduction ou partage extérieur, sans l'autorisation expresse des personnes concernées ou du Bureau, constitue une faute grave."},{p:"Le respect de la vie privée et de la dignité de chacun est une valeur essentielle de la Clinique d'Amour (CA)."}]},
{n:"Article 19",t:"Esprit communautaire",b:[{p:"La Clinique d'Amour n'est pas un espace de règlement de comptes personnels. Tout conflit d'ordre privé doit être géré en dehors du groupe, dans le respect des personnes concernées."},{p:"Les membres sont appelés à cultiver l'écoute, la bienveillance, la tolérance et l'esprit de famille, fondements essentiels de notre engagement collectif."}]},
{n:"Article 20",t:"Reconnaissance et distinction",b:[{p:"Afin d'encourager l'engagement communautaire, une reconnaissance symbolique ou des distinctions honorifiques (ex. : Membre d'Honneur, Bâtisseur, Pilier, etc.) seront attribuées chaque année lors de l'anniversaire de la communauté."},{p:"Ces distinctions visent à valoriser les membres les plus engagés dans les actions, le soutien aux autres, la participation active et la construction de la communauté."}]},
{n:"Article 21",t:"Dispositions de dissolution ou d'évolution",b:[{p:"En cas de dissolution, de crise majeure ou de nécessité d'évolution structurelle, une Assemblée Générale sera convoquée afin d'apprécier les orientations à donner à la communauté."},{p:"Dans une logique de formalisation, La Clinique d'Amour pourra évoluer en association légalement constituée selon les lois en vigueur."},{p:"Un avenant à la charte sera produit pour définir plus clairement les modalités de fonctionnement des Activités Génératrices de Revenus (AGR), leur gouvernance, leur répartition et leur contribution au modèle économique de la communauté."}]},
{n:"Article 22",t:"Révisions du règlement",b:[{p:"Ce règlement peut être révisé en Assemblée Générale ou par décision du bureau avec l'accord d'au moins 2/3 des membres actifs."}]}
];

/* =========================================================
   ÉTAT
   ========================================================= */
const TABS=[['accueil','Accueil'],['charte','Charte'],['adhesion','Adhésion'],['espace','Mon espace'],['admin','Bureau']];
let tab='accueil',uid=null,isAdmin=false,D={},msg='',firestoreReady=false;

/* Identifiant unique persistant (localStorage car ce n'est PAS une donnée partagée) */
uid=localStorage.getItem('cad_uid');
if(!uid){uid='u_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('cad_uid',uid);}
isAdmin=localStorage.getItem('cad_bureau')==='1';

/* =========================================================
   SYNCHRONISATION TEMPS RÉEL (Firestore)
   ========================================================= */
function watch(col,key){
  const ref=collection(firestore,col);
  onSnapshot(ref,snap=>{
    const nd={};
    snap.docs.forEach(d=>nd[d.id]=d.data());
    const same=JSON.stringify(D[key]||{})===JSON.stringify(nd);
    D[key]=nd;
    if(!same)render();
  },err=>{
    console.error('Erreur Firestore:',err);
    setSync('❌ Erreur : '+err.code,false);
  });
}
function setSync(text,ok){
  const el=$('#syncState');
  el.textContent=text;
  el.className=ok?'on':'';
}

/* =========================================================
   PARAMÈTRES
   ========================================================= */
function openSettings(){
  $('#bureauToggle').checked=isAdmin;
  $('#uidShow').textContent='Ton identifiant : '+uid;
  $('#settingsModal').style.display='flex';
}
function closeSettings(){$('#settingsModal').style.display='none';}
function setBureauMode(on){
  isAdmin=on;
  localStorage.setItem('cad_bureau',on?'1':'0');
  if(!on&&tab==='admin')tab='accueil';
  render();
}

/* =========================================================
   DÉMO / RESET
   ========================================================= */
async function loadDemo(){
  if(!confirm('Charger des données de démonstration ? (remplace les données actuelles)'))return;
  try{
    const now=Date.now();
    const batch=writeBatch(firestore);

    // Vide les collections
    for(const col of ['demandes','membres','ayants']){
      const snap=await getDocs(collection(firestore,col));
      snap.forEach(d=>batch.delete(d.ref));
    }

async function resetAll(){
  if(!confirm('Effacer TOUTES les données de la communauté ? (visible par TOUS les membres)'))return;
  if(!confirm('Vraiment sûr ? Action irréversible.'))return;
  try{
    const batch=writeBatch(firestore);
    for(const col of ['demandes','membres','ayants']){
      const snap=await getDocs(collection(firestore,col));
      snap.forEach(d=>batch.delete(d.ref));
    }
    await batch.commit();
    closeSettings();
    alert('Toutes les données ont été effacées.');
  }catch(e){alert('Erreur : '+e.message);}
}

/* =========================================================

   ========================================================= */
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  const next=cur==='dark'?'light':(cur==='light'?'dark':(sysDark?'light':'dark'));
  document.documentElement.setAttribute('data-theme',next);
}

/* =========================================================

function nav(){$('#nav').innerHTML=TABS.filter(t=>t[0]!=='admin'||isAdmin).map(t=>`<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');}
window.go=function(t){tab=t;msg='';render();window.scrollTo({top:0,behavior:'smooth'});};

function captureForm(){const o={};document.querySelectorAll('#app input,#app select,#app textarea').forEach(e=>{if(e.id)o[e.id]=e.type==='checkbox'?e.checked:e.value;});return o;}
function restoreForm(o){Object.entries(o).forEach(([id,v])=>{const e=document.getElementById(id);if(!e)return;if(e.type==='checkbox')e.checked=v;else e.value=v;});}
function render(){const st=captureForm();nav();const v={accueil,charte,adhesion,espace,admin}[tab]();$('#app').innerHTML=v;restoreForm(st);}

/* =========================================================

function blk(x){
  if(x.p)return `<p>${esc(x.p)}</p>`;
  if(x.h)return `<h4>${esc(x.h)}</h4>`;
  if(x.ul)return `<ul>${x.ul.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
  if(x.note)return `<div class="note">${esc(x.note)}</div>`;
  if(x.table)return `<div class="scroll"><table>${x.table.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`;
  return '';
}
function charte(){
  return `
  <div class="card"><h2>Charte de la Clinique d'Amour</h2>
    <p class="mu">Avant-projet · Droits &amp; Devoirs · #CliniquementVotre</p>
    <p class="mu">Les articles 5 à 8, 10 et 11 ne figurent pas dans le document fourni.</p>
    <input id="qch" placeholder="Rechercher dans la charte…" oninput="filterArts(this.value)">
    <div class="arts">${CH.map((a,i)=>`<a href="#art${i}">${esc(a.n)}</a>`).join('')}</div></div>
  ${CH.map((a,i)=>`<div class="card art" id="art${i}"><h3 style="color:var(--rd);margin-top:0">${esc(a.n)} — ${esc(a.t)}</h3>${a.b.map(blk).join('')}</div>`).join('')}`;
}
window.filterArts=function(v){v=v.toLowerCase().trim();document.querySelectorAll('.art').forEach(el=>{el.style.display=!v||el.textContent.toLowerCase().includes(v)?'':'none';});};

window.sendDem=async function(){

  msg='';
  try{
    await setDoc(doc(firestore,'demandes',uid),{
      nom:g('nom'),prenom:g('prenom'),tel:g('tel'),email:g('email'),
      ville:g('ville'),profession:g('prof'),categorie:g('cat'),
      motivation:g('mot'),statut:'En attente',validations:[],
      date:new Date().toISOString()
    });
  }catch(e){msg='Erreur : '+e.message;render();}
};

async function saveAy(liste){
  try{await setDoc(doc(firestore,'ayants',uid),{liste,membre:uid,maj:new Date().toISOString()});}
  catch(e){msg='Erreur : '+e.message;render();}
}
window.addAy=function(){const n=($('#a_nom').value||'').trim();if(!n){msg="Le nom de l'ayant droit est obligatoire.";return render();}msg='';saveAy([...(D.ay?.[uid]?.liste||[]),{nom:n,lien:$('#a_lien').value,naissance:$('#a_nai').value,tel:$('#a_tel').value}]);};
window.delAy=function(i){const l=[...(D.ay?.[uid]?.liste||[])];l.splice(i,1);saveAy(l);};

/* =========================================================
   ADMINISTRATION
   ========================================================= */
function admin(){
  if(!isAdmin)return `<div class="card"><h2>Accès restreint</h2><p>Activez le mode bureau dans ⚙️ Paramètres.</p><button class="btn" onclick="openSettings()">Ouvrir les paramètres</button></div>`;
  const dem=Object.entries(D.dem||{});
  const mem=Object.entries(D.mem||{}).filter(([k,m])=>m.actif!==false);
  const att=dem.filter(([k,d])=>d.statut!=='Refusée'&&!D.mem?.[k]);
  const ref=dem.filter(([k,d])=>d.statut==='Refusée'&&!D.mem?.[k]);
  const ay=D.ay||{};
  const nbAy=Object.values(ay).reduce((n,a)=>n+(a.liste||[]).length,0);
  return `
  <div class="card"><h2>Tableau de bord</h2><div class="stats">
    <div class="stat"><b>${mem.length}</b><span>Membres</span></div>
    <div class="stat"><b>${att.length}</b><span>En attente</span></div>
    <div class="stat"><b>${mem.filter(([k,m])=>m.categorie==='Membre actif').length}</b><span>Actifs</span></div>
    <div class="stat"><b>${nbAy}</b><span>Ayants droit</span></div></div></div>
  <div class="card"><h2>Demandes d'adhésion à valider</h2>
    <p class="mu">Deux validations distinctes de membres du bureau sont requises (art. 3).</p>
    ${att.map(([k,d])=>{const v=d.validations||[];const deja=v.includes(uid);return `<div class="item">
      <b>${esc(d.prenom)} ${esc(d.nom)}</b> <span class="tag">${esc(d.categorie)}</span>
      <div class="mu">${esc(d.tel)}${d.email?' · '+esc(d.email):''} · ${esc(d.ville)}${d.profession?' · '+esc(d.profession):''}</div>
      <div class="mu">Déposée le ${esc((d.date||'').slice(0,10))}</div>
      ${d.motivation?`<p class="mot">« ${esc(d.motivation)} »</p>`:''}
      <div class="mu">Validations : <b>${v.length}/2</b>${deja?' · vous avez déjà validé':''}</div>
      ${deja?'':`<button class="btn s" onclick="valid('${k}')">✔ Valider</button>`}
      <button class="btn s danger" onclick="refus('${k}')">✖ Refuser</button></div>`;}).join('')||'<p class="mu">Aucune demande en attente.</p>'}</div>
  <div class="card"><h2>Liste des membres (${mem.length})</h2>
    <input id="q" placeholder="Rechercher un membre…" oninput="filterRows(this.value)">
    <div class="scroll"><table id="memTable"><thead><tr><th>Nom</th><th>Catégorie</th><th>Ville</th><th>Tél.</th><th>Ayants droit</th><th></th></tr></thead>
    <tbody>${mem.map(([k,m])=>`<tr>
      <td>${esc(m.prenom)} ${esc(m.nom)}</td><td>${esc(m.categorie)}</td><td>${esc(m.ville)}</td><td>${esc(m.tel)}</td>
      <td>${(ay[k]?.liste||[]).map(a=>esc(a.nom)+' ('+esc(a.lien)+')').join(', ')||'—'}</td>
      <td><button class="btn s danger" onclick="retirer('${k}')">Retirer</button></td></tr>`).join('')}</tbody></table></div>
    <button class="btn s" onclick="exportCSV()">⬇ Exporter en CSV</button></div>
  ${ref.length?`<div class="card"><h2>Demandes refusées</h2>${ref.map(([k,d])=>`<div class="item">
    <b>${esc(d.prenom)} ${esc(d.nom)}</b> <span class="mu">— ${esc((d.date||'').slice(0,10))}</span>
    <button class="btn s" onclick="reouvrir('${k}')">Réexaminer</button></div>`).join('')}</div>`:''}`;
}
window.filterRows=function(v){v=(v||'').toLowerCase();document.querySelectorAll('#memTable tbody tr').forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(v)?'':'none';});};

window.valid=async function(k){
  const d=D.dem?.[k];if(!d)return;
  const v=[...new Set([...(d.validations||[]),uid])];
  try{
    if(v.length>=2){
      await setDoc(doc(firestore,'membres',k),{
        nom:d.nom,prenom:d.prenom,tel:d.tel,email:d.email||'',
        ville:d.ville,profession:d.profession||'',categorie:d.categorie,
        motivation:d.motivation||'',dateAdhesion:new Date().toISOString(),
        validePar:v,actif:true
      });
      await updateDoc(doc(firestore,'demandes',k),{validations:v,statut:'Validée',dateValidation:new Date().toISOString()});
    }else{
      await updateDoc(doc(firestore,'demandes',k),{validations:v});
    }
  }catch(e){alert(e.message);}
};
window.refus=async function(k){if(!confirm('Refuser cette demande ?'))return;try{await updateDoc(doc(firestore,'demandes',k),{statut:'Refusée',refusePar:uid});}catch(e){alert(e.message);}};
window.reouvrir=async function(k){try{await updateDoc(doc(firestore,'demandes',k),{statut:'En attente',validations:[]});}catch(e){alert(e.message);}};
window.retirer=async function(k){if(!confirm('Retirer ce membre ? (art. 4 — NB)'))return;try{await updateDoc(doc(firestore,'membres',k),{actif:false,retireLe:new Date().toISOString()});}catch(e){alert(e.message);}};
window.exportCSV=function(){
  const mem=Object.entries(D.mem||{}).filter(([k,m])=>m.actif!==false);
  const rows=[['Nom','Prénom','Catégorie','Ville','Téléphone','Email','Profession','Membre depuis','Ayants droit']];
  mem.forEach(([k,m])=>{rows.push([m.nom,m.prenom,m.categorie,m.ville,m.tel,m.email||'',m.profession||'',(m.dateAdhesion||'').slice(0,10),(D.ay?.[k]?.liste||[]).map(a=>a.nom+' ('+a.lien+')').join(' | ')]);});
  const csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='membres-clinique-damour.csv';document.body.appendChild(a);a.click();a.remove();
};

window.openSettings=openSettings;
window.closeSettings=closeSettings;
window.setBureauMode=setBureauMode;
window.toggleTheme=toggleTheme;
window.loadDemo=loadDemo;
window.resetAll=resetAll;

/* =========================================================
   DÉMARRAGE
   ========================================================= */
setSync('🔄 Synchronisation…',false);
watch('demandes','dem');
watch('membres','mem');
watch('ayants','ay');
render();
setTimeout(()=>setSync('✔ Synchronisé (temps réel)',true),1500);
</script>
